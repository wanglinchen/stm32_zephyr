# ============================================================
# apollo_f429 专用：把板上各模块对应的驱动子系统打开
# 板级 devicetree 已经声明节点，这里只打开“能力开关”
# ============================================================

CONFIG_MAIN_STACK_SIZE=4096
# 日志为 deferred 模式：8KB 缓冲对本应用（约 20 条日志）严重过剩，1024 B 足够
CONFIG_LOG_BUFFER_SIZE=1024

# ---- 总线 ----
CONFIG_SPI=y                    # SPI5(W25Q256) + spi-bitbang(XPT2046)
CONFIG_I2C=y                    # I2C2(EEPROM/PCF8574/IMU/光感/气压/编解码)

# ---- 存储 ----
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y      # NAND 页布局 (mt29f4g08)
CONFIG_SPI_NOR=y                # W25Q256
# 注：Zephyr 4.5 已不再提供 AT24/24C02 的 I2C devicetree 驱动，
#     板上 24C02 目前通过 i2c2 直接读写（详见 docs/模块-驱动对照表.md）

# ---- 传感器 ----
CONFIG_SENSOR=y                 # QMI8658A / AP3216C / DHT11

# ---- 显示 / 触摸 ----
CONFIG_DISPLAY=y                # LTDC + 8080 并口屏
CONFIG_INPUT=y                  # XPT2046 触摸

# ---- 模拟 ----
CONFIG_ADC=y
CONFIG_ADC_STM32=y              # ADC1（PA5 电位器/电池检测）
CONFIG_DAC=y                    # DAC1（PA4）

# ---- 其他片上外设 ----
CONFIG_RTC=y
